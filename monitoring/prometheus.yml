global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'velzion_platform'
    static_configs:
      - targets:
        - 'host.docker.internal:8081' # Auth
        - 'host.docker.internal:8082' # Velzard
        - 'host.docker.internal:8083' # Zegion
        - 'host.docker.internal:8084' # Telemetry
